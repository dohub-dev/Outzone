  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px}
  .mono{font-family:var(--data);font-variant-numeric:tabular-nums}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
  header{background:var(--surface);border-bottom:1px solid var(--line);border-top:4px solid var(--topline);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
  .hbar{display:flex;align-items:center;gap:12px;padding:14px 22px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px;margin-right:auto}
  .logo{width:40px;height:40px;border-radius:10px;background:var(--orange);display:grid;place-items:center;color:#fff}
  .brand h1{margin:0;font-size:17px;font-weight:700;line-height:1.1}
  .brand small{font-size:10px;letter-spacing:2.5px;color:var(--muted);font-weight:600}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);padding:4px 10px;border-radius:999px;background:var(--gray-bg)}

  @keyframes pulse{50%{opacity:.35}}

  .search{position:relative;width:320px;max-width:100%}

  .search input{width:100%;height:42px;border:1px solid var(--line);background:var(--field);color:var(--text);border-radius:10px;padding:0 12px 0 36px;font:inherit}
  .btn{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font:inherit;font-weight:600;display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--text)}
  .btn.primary{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
  .btn.primary:hover{background:var(--navy-2)}
  .btn:disabled{opacity:.6;cursor:progress}
  main{max-width:1180px;margin:0 auto;padding:24px 16px 40px}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;align-items:center;gap:16px;min-height:112px;min-width:0}
  .ic{width:44px;height:44px;border-radius:10px;background:var(--icon-bg);display:grid;place-items:center;color:var(--strong);flex:none}
  .card .lbl{font-size:12.5px;color:var(--muted);margin-bottom:4px}
  .card .val{font-size:24px;font-weight:700;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .card .val small{font-size:12px;color:var(--muted);font-weight:500;font-family:var(--body)}
  .pill{font-size:10.5px;padding:2px 7px;border-radius:999px;font-weight:700}
  .pill.up{background:var(--green-bg);color:var(--green)} .pill.down{background:var(--red-bg);color:var(--red)}
  .card.dark{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
  .card.dark .ic{background:rgba(255,255,255,.12);color:var(--on-navy)}
  .card.dark .lbl,.card.dark .by{color:var(--on-navy-muted)}
  .card.dark .val{font-size:18px;line-height:1.5;display:block}
  .card.dark .by{font-size:11.5px;margin-top:2px;font-family:var(--body);font-weight:500}
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:22px 0 14px}
  .seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}

  .range{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 10px}

  .pager button.on{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
  .pager button:disabled{opacity:.4;cursor:default}
  .lbl-m{display:none}

  .toast.err{background:var(--red);color:#fff}
  @media (max-width:980px){.cards{grid-template-columns:repeat(2,1fr)}}

  @media (max-width:720px){
    body{font-size:13px}

    .card .lbl{font-size:11.5px}

    .card.dark .val{font-size:15px}
    .card.dark .val br{display:none}
    .toolbar{gap:8px;margin:16px 0 12px}
    .toolbar > *{width:100%}
    .seg{display:flex}
    .seg button{flex:1;padding:8px 4px;font-size:12.5px;white-space:nowrap}
    #quick{overflow-x:auto;scrollbar-width:none}
    #quick::-webkit-scrollbar{display:none}
    #quick button{flex:1 0 auto;padding:8px 10px}
    .range{justify-content:space-between;padding:6px 10px}
    .range input{min-width:0;flex:1;font-size:13px}
    select.stf{height:40px}
    .count{margin:0;text-align:right;font-size:12px}
    .tbl{background:none;border:0;border-radius:0;overflow:visible}
    table,tbody{display:block;min-width:0}
    thead{display:none}
    tbody tr{display:grid;grid-template-columns:1fr auto;grid-template-areas:"dest stat" "dates price" "veh veh";
      background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
    tbody tr:hover{background:var(--surface)}
    td{display:block;border:0;padding:0;min-width:0}
    td.dest{grid-area:dest;padding:14px 14px 6px}
    td.dest b{font-size:14.5px;font-weight:600}
    td.stat{grid-area:stat;padding:14px 14px 6px 0;text-align:right}
    td.dates{grid-area:dates;padding:2px 14px 12px;display:flex;gap:14px;flex-wrap:wrap}
    .dates div{font-size:12.5px}
    td.price{grid-area:price;padding:2px 14px 12px 0;align-self:end}
    .lbl-m{display:block;font-size:10.5px;color:var(--muted);font-weight:500;font-family:var(--body)}
    td.veh{grid-area:veh;background:var(--field);border-top:1px solid var(--line);padding:12px 14px}
    .kv{column-gap:12px;row-gap:6px}
    .kv dd{font-size:14.5px;word-break:break-word}
    .badge{font-size:11px;padding:4px 9px;white-space:normal;text-align:center}
    td.emptyrow{background:var(--surface);border:1px solid var(--line);border-radius:14px}
    tr:has(.emptyrow){display:block}
    .pager{padding:6px 0;flex-wrap:wrap}
  }
  @media (max-width:360px){
    .cards{grid-template-columns:1fr}
    .kv{grid-template-columns:1fr}
    .kv dt{margin-top:4px}

const TH_MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MON_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

let DATA = [], META = {}, page = 1, loaded = false;
let artifactCap = null;
const st = { field:'load', from:null, to:null, status:'', q:'' };

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const iso = d => d ? `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}` : '';
const fromIso = s => { if (!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const dmy = d => d ? `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}` : '-';
const baht = n => '฿' + Math.round(n).toLocaleString('en-US');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g,'')); return isNaN(n) ? 0 : n; };

let toastT;
function toast(msg, err){ const t = $('toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, err ? 6000 : 3500); }

function toDate(v){
  if (v == null || v === '') return null;
  if (v instanceof Date) return new Date(v.getFullYear(), v.getMonth(), v.getDate());
  if (typeof v === 'number') { const d = XLSX.SSF.parse_date_code(v); return d ? new Date(d.y, d.m-1, d.d) : null; }
  const m = String(v).match(/(\d{1,4})[\/\-](\d{1,2})[\/\-](\d{1,4})/);
  if (m) { let [a,b,c] = [+m[1],+m[2],+m[3]]; if (a > 31) return new Date(a,b-1,c); if (c > 2400) c -= 543; return new Date(c,b-1,a); }
  const d = new Date(v); return isNaN(d) ? null : new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

// Columns: A load, B deliv, C no, F place, H province, I status, L price, N paid, O partner, P driver, Q plate, R phone, T vehicle
function parseWorkbook(buf){
  const wb = XLSX.read(buf, { type:'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:'' });
  return rows.slice(1).filter(r => r.some(c => c !== '')).map(r => ({
    load: toDate(r[0]), deliv: toDate(r[1]), no: String(r[2]).trim(),
    place: String(r[5]).split('\n')[0].trim(), province: String(r[7]).trim(),
    status: String(r[8]).trim(), price: num(r[11]), paid: num(r[13]),
    partner: String(r[14]).trim(), driver: String(r[15]).trim(), plate: String(r[16]).trim(),
    phone: String(r[17]).trim(), vehicle: String(r[19] || r[18]).trim(),
  }));
}

// Compact row format stored in the shared database
const encode = r => [iso(r.load), iso(r.deliv), r.no, r.place, r.province, r.status, r.price, r.paid, r.partner, r.driver, r.plate, r.phone, r.vehicle];
const decode = a => ({ load: fromIso(a[0]), deliv: fromIso(a[1]), no: a[2], place: a[3], province: a[4], status: a[5], price: a[6], paid: a[7], partner: a[8], driver: a[9], plate: a[10], phone: a[11], vehicle: a[12] });

function badgeClass(s){
  if (s.includes('ยกเลิก')) return 'b-red';
  if (s.includes('บิล') || s.includes('EMS') || s.includes('สำเร็จ')) return 'b-green';
  if (s.includes('รถออก')) return 'b-violet';
  if (s.includes('ไม่มีทะเบียน') || s.includes('งานใหม่') || s.includes('รอ')) return 'b-amber';
  if (s.includes('ทะเบียน')) return 'b-blue';
  return '';
}

function setQuick(q){
  const t = new Date(); t.setHours(0,0,0,0);
  const add = n => { const d = new Date(t); d.setDate(d.getDate()+n); return d; };
  if (q === 'today') { st.from = t; st.to = t; }
  else if (q === 'yesterday') { st.from = add(-1); st.to = add(-1); }
  else if (q === 'tomorrow') { st.from = add(1); st.to = add(1); }
  else if (q === 'week') { st.from = t; st.to = add(6); }
  else if (q === 'month') { st.from = new Date(t.getFullYear(), t.getMonth(), 1); st.to = new Date(t.getFullYear(), t.getMonth()+1, 0); }
  else { st.from = null; st.to = null; }
  $('from').value = iso(st.from); $('to').value = iso(st.to);
  document.querySelectorAll('#quick button').forEach(b => b.classList.toggle('on', b.dataset.q === q));
  page = 1; render();
}

function inRange(r){
  const d = r[st.field];
  if (st.from && (!d || d < st.from)) return false;
  if (st.to && (!d || d > st.to)) return false;
  return true;
}

function renderCards(){
  const t = new Date(); t.setHours(0,0,0,0);
  const isToday = st.from && st.to && +st.from === +t && +st.to === +t;
  const active = DATA.filter(r => r.status !== CANCEL);
  $('jobCount').textContent = active.filter(inRange).length.toLocaleString();
  $('jobLbl').textContent = (isToday ? 'งานวันนี้' : !st.from && !st.to ? 'งานทั้งหมด' : 'งานในช่วงที่เลือก') + ' (ไม่รวมยกเลิก)';

  const profit = r => r.price - r.paid;
  $('profitAll').textContent = baht(active.reduce((s,r) => s + profit(r), 0));
  const y = t.getFullYear(), m = t.getMonth(), pm = new Date(y, m-1, 1);
  const sumMonth = (yy, mm) => active.filter(r => r.load && r.load.getFullYear() === yy && r.load.getMonth() === mm).reduce((s,r) => s + profit(r), 0);
  const cur = sumMonth(y, m), prev = sumMonth(pm.getFullYear(), pm.getMonth());
  $('monthLbl').textContent = `กำไรเดือน ${TH_MON_FULL[m]} ${y + 543}`;
  $('profitMonth').textContent = baht(cur);
  const pill = $('monthPct');
  if (prev) { const p = (cur - prev) / Math.abs(prev) * 100; pill.textContent = (p >= 0 ? '+' : '') + p.toFixed(1) + '%'; pill.className = 'pill ' + (p >= 0 ? 'up' : 'down'); pill.title = 'เทียบเดือนก่อน ' + baht(prev); }
  else { pill.textContent = ''; pill.className = 'pill'; }

  const u = META.uploadedAt ? new Date(META.uploadedAt) : null;
  $('updated').innerHTML = u ? `${u.getDate()} ${TH_MON[u.getMonth()]} ${String(u.getFullYear()+543).slice(-2)}<br> ${pad(u.getHours())}:${pad(u.getMinutes())}` : '-';
  $('updated').title = META.fileName || '';
}

function render(){
  renderCards();
  const q = st.q.toLowerCase();
  const list = DATA.filter(r => inRange(r)
      && (!st.status || r.status === st.status)
      && (!q || [r.plate, r.no, r.driver, r.partner, r.place, r.province].some(v => String(v).toLowerCase().includes(q))))
    .sort((a,b) => (a[st.field]||0) - (b[st.field]||0) || String(a.no).localeCompare(String(b.no)));

  const pages = Math.max(1, Math.ceil(list.length / PAGE));
  page = Math.min(page, pages);
  const slice = list.slice((page-1)*PAGE, page*PAGE);
  $('count').textContent = `แสดง ${list.length.toLocaleString()} จาก ${DATA.length.toLocaleString()} รายการ`;

  const kv = (k, v, cls = '') => `<dt>${k}</dt><dd class="${v ? cls : 'empty'}">${v ? esc(v) : '—'}</dd>`;
  const kvTel = v => v ? `<dt>เบอร์โทรศัพท์</dt><dd><a href="tel:${esc(v.replace(/[^0-9+]/g, ''))}">${esc(v)}</a></dd>` : kv('เบอร์โทรศัพท์', v);
  const empty = !loaded ? '<b>กำลังโหลดข้อมูล…</b>รายการงานจะแสดงที่นี่'
    : !DATA.length ? '<b>ยังไม่มีข้อมูล</b>กด "อัปโหลด Excel" เพื่อเพิ่มรายการงาน แล้วทุกเครื่องจะเห็นพร้อมกัน'
    : '<b>ไม่พบรายการ</b>ลองเปลี่ยนช่วงวันที่ หรือกด "ทั้งหมด"';
  $('rows').innerHTML = slice.length ? slice.map(r => `<tr>
    <td class="dates mono"><div><span>ขึ้น :</span> ${dmy(r.load)}</div><div><span>ส่ง :</span> ${dmy(r.deliv)}</div></td>
    <td class="dest"><b>${esc(r.place)}${r.province ? ', ' + esc(r.province) : ''}</b><small class="mono">#${esc(r.no)}</small></td>
    <td class="veh"><dl class="kv">${kv('Partner', r.partner)}${kv('ทะเบียนรถ', r.plate, 'plate')}${kv('คนขับ', r.driver)}${kvTel(r.phone)}${kv('รถที่เข้ารับสินค้า', r.vehicle, 'sub')}</dl></td>
    <td class="r price mono"><span class="lbl-m">ราคาที่จ่าย</span>${r.paid ? baht(r.paid) : '—'}</td>
    <td class="stat"><span class="badge ${badgeClass(r.status)}">${esc(r.status || '-')}</span></td>
  </tr>`).join('') : `<tr><td colspan="5" class="emptyrow">${empty}</td></tr>`;

  const pg = $('pager');
  if (pages <= 1) { pg.innerHTML = ''; return; }
  const nums = [...new Set([1, page-1, page, page+1, pages])].filter(n => n >= 1 && n <= pages).sort((a,b) => a-b);
  let h = `<button ${page===1?'disabled':''} data-p="${page-1}" aria-label="หน้าก่อน">‹</button>`, last = 0;
  nums.forEach(n => { if (n - last > 1) h += '<button disabled>…</button>'; h += `<button class="${n===page?'on':''}" data-p="${n}">${n}</button>`; last = n; });
  pg.innerHTML = h + `<button ${page===pages?'disabled':''} data-p="${page+1}" aria-label="หน้าถัดไป">›</button>`;
}

function fillStatus(){
  const cur = st.status;
  const s = [...new Set(DATA.map(r => r.status).filter(Boolean))].sort();
  $('status').innerHTML = '<option value="">ทุกสถานะ</option>' + s.map(x => `<option${x===cur?' selected':''}>${esc(x)}</option>`).join('');
  if (cur && !s.includes(cur)) st.status = '';
}

function setData(rows, meta){
  DATA = rows; META = meta; loaded = true;
  fillStatus(); render();
}

function setLive(state){
  $('live').classList.toggle('on', state === 'on');
  $('liveTxt').textContent = state === 'on' ? 'Live' : 'ไฟล์ในเครื่อง';
}

// ---------- Self-publishing ----------
// The job data lives inside this page (<script id="fleet-data">). An upload by an
// editor republishes the whole page with the new data; every open view reloads to it.
const SKELETON_RESET = ':root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif;background:#fafaf9}img{max-width:100%}[hidden]{display:none!important}';
const HEAD_TAGS = '<title>Smart Fleet</title>'
  + '<link rel="preconnect" href="https://fonts.googleapis.com">'
  + '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'
  + '<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">'
  + '<scr' + 'ipt src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></scr' + 'ipt>';

function buildDocument(payload){
  const reset = document.head.querySelector('style:not(#sf-style)')?.textContent || SKELETON_RESET;
  const json = JSON.stringify(payload).replace(/</g, '\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'
    + reset + '</style></head><body>'
    + HEAD_TAGS
    + '<style id="sf-style">' + $('sf-style').textContent + '</style>'
    + '<div id="app"></div>'
    + '<scr' + 'ipt id="fleet-data" type="application/json">' + json + '</scr' + 'ipt>'
    + '<scr' + 'ipt id="sf-main">' + $('sf-main').textContent + '</scr' + 'ipt>'
    + '</body></html>';
}

function readEmbedded(){
  try {
    const p = JSON.parse($('fleet-data').textContent || '{}');
    return { rows: (p.rows || []).map(decode), meta: p.meta || {} };
  } catch (_) { return { rows: [], meta: {} }; }
}

function showUploader(){ $('updatedBy').textContent = META.uploadedByName ? 'โดย ' + META.uploadedByName : ''; }

// ---------- Events ----------
$('upBtn').onclick = () => $('file').click();
$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  e.target.value = '';
  const rd = new FileReader();
  rd.onload = async () => {
    let rows;
    try { rows = parseWorkbook(rd.result); } catch (err) { toast('อ่านไฟล์ไม่สำเร็จ: ตรวจสอบว่าเป็นไฟล์ Excel (.xlsx) ที่ export จากระบบ', true); return; }
    if (!rows.length) { toast('ไฟล์นี้ไม่มีรายการงาน', true); return; }
    const meta = { fileName: f.name, uploadedAt: new Date().toISOString() };
    if (!artifactCap) { setData(rows, meta); showUploader(); toast('โหลดไฟล์แล้ว (ดูได้เฉพาะเครื่องนี้)'); return; }
    const btn = $('upBtn'); btn.disabled = true; $('upTxt').textContent = 'กำลังบันทึก…';
    try {
      const u = await window.claude.use('user');
      const me = u ? await u.me().catch(() => null) : null;
      if (me && me.name) meta.uploadedByName = me.name;
      await artifactCap.publish(buildDocument({ meta, rows: rows.map(encode) }));
      toast(`อัปโหลดแล้ว ${rows.length.toLocaleString()} รายการ ทุกเครื่องจะเห็นข้อมูลนี้`);
    } catch (err) {
      const c = err && err.code;
      if (c === 'conflict') toast('มีคนอัปเดตข้อมูลพร้อมกัน หน้านี้จะโหลดข้อมูลล่าสุด กรุณาอัปโหลดอีกครั้ง', true);
      else if (c === 'not_writer' || c === 'not_granted') toast('บัญชีนี้ไม่มีสิทธิ์อัปโหลดข้อมูล ติดต่อเจ้าของ Dashboard', true);
      else if (c === 'too_large') toast('ไฟล์ใหญ่เกินไป', true);
      else if (c === 'rate_limited') toast('อัปโหลดถี่เกินไป รอสักครู่แล้วลองใหม่', true);
      else toast('อัปโหลดไม่สำเร็จ ลองอีกครั้ง', true);
      btn.disabled = false; $('upTxt').textContent = 'อัปโหลด Excel';
    }
  };
  rd.readAsArrayBuffer(f);
};
document.querySelectorAll('#quick button').forEach(b => b.onclick = () => setQuick(b.dataset.q));
document.querySelectorAll('#dateField button').forEach(b => b.onclick = () => {
  st.field = b.dataset.f;
  document.querySelectorAll('#dateField button').forEach(x => x.classList.toggle('on', x === b));
  page = 1; render();
});
const onRange = () => {
  st.from = fromIso($('from').value); st.to = fromIso($('to').value);
  document.querySelectorAll('#quick button').forEach(b => b.classList.remove('on'));
  page = 1; render();
};
$('from').onchange = onRange; $('to').onchange = onRange;
$('status').onchange = e => { st.status = e.target.value; page = 1; render(); };
$('q').oninput = e => { st.q = e.target.value.trim(); page = 1; render(); };
$('pager').onclick = e => { const p = e.target.dataset.p; if (p) { page = +p; render(); window.scrollTo({ top: $('rows').closest('section').offsetTop - 90 }); } };

{
  const emb = readEmbedded();
  setData(emb.rows, emb.meta);
  showUploader();
  setQuick('today');
}

(async () => {
  const c = window.claude;
  if (!c || !c.use) { setLive('local'); $('upBtn').hidden = false; return; }
  setLive('on');
  const [art, u] = await Promise.all([c.use('artifact'), c.use('user')]);
  artifactCap = art;
  let canEdit = false;
  try { canEdit = u ? await u.canEdit() : false; } catch (_) {}
  $('upBtn').hidden = !(artifactCap && canEdit);
})();
</script></body></html>
