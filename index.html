<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Smart Fleet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  /* Layout: sticky brand bar, KPI row, filter toolbar, job table that folds into cards on phones */
  :root{
    --bg:#f4f6f9; --surface:#fff; --field:#f8fafc; --hover:#fafbfd; --line:#e3e8ef; --text:#0f2233; --muted:#6b7a8c; --faint:#b3bdc9;
    --navy:#0d3b5e; --navy-2:#134b74; --on-navy:#fff; --on-navy-muted:#c9d7e4; --strong:#0d3b5e;
    --orange:#e8623a; --icon-bg:#eef3f8; --topline:#1f2328;
    --green:#1f8a4c; --green-bg:#e3f5ea; --red:#c0392b; --red-bg:#fdecea;
    --amber:#a36a00; --amber-bg:#fff4dc; --plate:#7a4a00; --blue:#1d5f9a; --blue-bg:#e6f0fa;
    --violet:#6a45b3; --violet-bg:#efe9fb; --gray-bg:#eef1f4;
    --body:'IBM Plex Sans Thai',system-ui,sans-serif; --data:'JetBrains Mono',ui-monospace,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0e1621; --surface:#15202c; --field:#1a2735; --hover:#192634; --line:#263546; --text:#e4ebf2; --muted:#8fa0b3; --faint:#55657a;
    --navy:#1a5582; --navy-2:#226495; --on-navy:#fff; --on-navy-muted:#b9cde0; --strong:#9fcbf0;
    --icon-bg:#1d2b3b; --topline:#000;
    --green:#5fd08f; --green-bg:#173a28; --red:#ff8a7a; --red-bg:#43201d;
    --amber:#f2c062; --amber-bg:#3d2f12; --plate:#ffd88a; --blue:#8cc2f2; --blue-bg:#183451;
    --violet:#c2a8f5; --violet-bg:#2e2448; --gray-bg:#223142; color-scheme:dark } }
  :root[data-theme="dark"]{
    --bg:#0e1621; --surface:#15202c; --field:#1a2735; --hover:#192634; --line:#263546; --text:#e4ebf2; --muted:#8fa0b3; --faint:#55657a;
    --navy:#1a5582; --navy-2:#226495; --on-navy:#fff; --on-navy-muted:#b9cde0; --strong:#9fcbf0;
    --icon-bg:#1d2b3b; --topline:#000;
    --green:#5fd08f; --green-bg:#173a28; --red:#ff8a7a; --red-bg:#43201d;
    --amber:#f2c062; --amber-bg:#3d2f12; --plate:#ffd88a; --blue:#8cc2f2; --blue-bg:#183451;
    --violet:#c2a8f5; --violet-bg:#2e2448; --gray-bg:#223142; color-scheme:dark }

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--body);font-size:14px}
  .mono{font-family:var(--data);font-variant-numeric:tabular-nums}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
  header{background:var(--surface);border-bottom:1px solid var(--line);border-top:4px solid var(--topline);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
  .hbar{display:flex;align-items:center;gap:12px;padding:14px 22px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:12px;margin-right:auto}
  .logo{width:40px;height:40px;border-radius:10px;background:var(--orange);display:grid;place-items:center;color:#fff}
  .brand h1{margin:0;font-size:17px;font-weight:700;line-height:1.1}
  .brand small{font-size:10px;letter-spacing:2.5px;color:var(--muted);font-weight:600}
  .live{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);padding:4px 10px;border-radius:999px;background:var(--gray-bg)}
  .live i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
  .live.on{color:var(--green);background:var(--green-bg)} .live.on i{background:var(--green);animation:pulse 2s infinite}
  @keyframes pulse{50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.live.on i{animation:none}}
  .search{position:relative;width:320px;max-width:100%}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
  .search input{width:100%;height:42px;border:1px solid var(--line);background:var(--field);color:var(--text);border-radius:10px;padding:0 12px 0 36px;font:inherit}
  .btn{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 14px;font:inherit;font-weight:600;display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--text)}
  .btn.primary{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
  .btn.primary:hover{background:var(--navy-2)}
  .btn:disabled{opacity:.6;cursor:progress}
  main{max-width:1180px;margin:0 auto;padding:24px 16px 40px}
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;align-items:center;gap:16px;min-height:112px;min-width:0}
  .ic{width:44px;height:44px;border-radius:10px;background:var(--icon-bg);display:grid;place-items:center;color:var(--strong);flex:none}
  .card .lbl{font-size:12.5px;color:var(--muted);margin-bottom:4px}
  .card .val{font-size:24px;font-weight:700;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .card .val small{font-size:12px;color:var(--muted);font-weight:500;font-family:var(--body)}
  .pill{font-size:10.5px;padding:2px 7px;border-radius:999px;font-weight:700}
  .pill.up{background:var(--green-bg);color:var(--green)} .pill.down{background:var(--red-bg);color:var(--red)}
  .card.dark{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
  .card.dark .ic{background:rgba(255,255,255,.12);color:var(--on-navy)}
  .card.dark .lbl,.card.dark .by{color:var(--on-navy-muted)}
  .card.dark .val{font-size:18px;line-height:1.5;display:block}
  .card.dark .by{font-size:11.5px;margin-top:2px;font-family:var(--body);font-weight:500}
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:22px 0 14px}
  .seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
  .seg button{border:0;background:none;font:inherit;font-size:13px;padding:6px 12px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600}
  .seg button.on{background:var(--navy);color:var(--on-navy)}
  .range{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px 10px}
  .range input{border:0;font:inherit;font-size:13px;color:var(--text);background:none}
  .range span{color:var(--muted);font-size:12px}
  select.stf{height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font:inherit;font-size:13px;padding:0 10px}
  .count{margin-left:auto;color:var(--muted);font-size:13px}
  .tbl{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .tbl-scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:960px}
  th{text-align:left;font-size:12.5px;font-weight:700;padding:16px 20px;border-bottom:1px solid var(--line);white-space:nowrap}
  th.r,td.r{text-align:right}
  td{padding:18px 20px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--hover)}
  .dates div{font-size:13px;line-height:1.7;white-space:nowrap}
  .dates span{color:var(--muted);font-size:12px}
  .dest b{font-weight:500;display:block}
  .dest small{color:var(--muted);font-size:12px}
  .kv{display:grid;grid-template-columns:auto 1fr;column-gap:14px;row-gap:5px;font-size:13px;align-items:baseline}
  .kv dt{color:var(--muted);white-space:nowrap} .kv dd{margin:0;font-size:15px;font-weight:700;color:var(--strong)}
  .kv dd.plate{font-family:var(--data);font-size:15px;background:var(--amber-bg);color:var(--plate);padding:1px 8px;border-radius:6px;justify-self:start}
  .kv dd.sub{font-size:13px;font-weight:500;color:var(--text)}
  .kv .empty{color:var(--faint)}
  .kv a{color:inherit;text-decoration:none}
  .price{font-weight:700;font-size:14px;white-space:nowrap}
  .badge{display:inline-block;font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--gray-bg);color:var(--text)}
  .b-blue{background:var(--blue-bg);color:var(--blue)} .b-green{background:var(--green-bg);color:var(--green)}
  .b-red{background:var(--red-bg);color:var(--red)} .b-amber{background:var(--amber-bg);color:var(--amber)}
  .b-violet{background:var(--violet-bg);color:var(--violet)}
  .emptyrow{text-align:center;color:var(--muted);padding:48px}
  .emptyrow b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
  .pager{display:flex;justify-content:center;gap:6px;padding:14px}
  .pager button{min-width:34px;height:32px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
  .pager button.on{background:var(--navy);color:var(--on-navy);border-color:var(--navy)}
  .pager button:disabled{opacity:.4;cursor:default}
  .lbl-m{display:none}
  .toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.18)}
  .toast.err{background:var(--red);color:#fff}
  @media (max-width:980px){.cards{grid-template-columns:repeat(2,1fr)}}

  @media (max-width:720px){
    body{font-size:13px}
    .hbar{padding:10px 16px;gap:10px}
    .logo{width:36px;height:36px}
    .brand h1{font-size:16px} .brand small{font-size:9px;letter-spacing:2px}
    .search{order:3;width:100%;flex:1 1 100%}
    .btn{height:38px;padding:0 12px;font-size:13px}
    main{padding:14px 12px 32px}
    .cards{grid-template-columns:1fr 1fr;gap:10px}
    .card{padding:14px;gap:10px;min-height:0;flex-direction:column;align-items:flex-start}
    .ic{width:34px;height:34px;border-radius:8px}
    .ic svg{width:17px;height:17px}
    .card .lbl{font-size:11.5px}
    .card .val{font-size:19px}
    .card:first-child,.card.dark{grid-column:1 / -1;flex-direction:row;align-items:center}
    .card.dark .val{font-size:15px}
    .card.dark .val br{display:none}
    .toolbar{gap:8px;margin:16px 0 12px}
    .toolbar > *{width:100%}
    .seg{display:flex}
    .seg button{flex:1;padding:8px 4px;font-size:12.5px;white-space:nowrap}
    #quick{overflow-x:auto;scrollbar-width:none}
    #quick::-webkit-scrollbar{display:none}
    #quick button{flex:1 0 auto;padding:8px 10px}
    .range{justify-content:space-between;padding:6px 10px}
    .range input{min-width:0;flex:1;font-size:13px}
    select.stf{height:40px}
    .count{margin:0;text-align:right;font-size:12px}
    .tbl{background:none;border:0;border-radius:0;overflow:visible}
    table,tbody{display:block;min-width:0}
    thead{display:none}
    tbody tr{display:grid;grid-template-columns:1fr auto;grid-template-areas:"dest stat" "dates price" "veh veh";
      background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
    tbody tr:hover{background:var(--surface)}
    td{display:block;border:0;padding:0;min-width:0}
    td.dest{grid-area:dest;padding:14px 14px 6px}
    td.dest b{font-size:14.5px;font-weight:600}
    td.stat{grid-area:stat;padding:14px 14px 6px 0;text-align:right}
    td.dates{grid-area:dates;padding:2px 14px 12px;display:flex;gap:14px;flex-wrap:wrap}
    .dates div{font-size:12.5px}
    td.price{grid-area:price;padding:2px 14px 12px 0;align-self:end}
    .lbl-m{display:block;font-size:10.5px;color:var(--muted);font-weight:500;font-family:var(--body)}
    td.veh{grid-area:veh;background:var(--field);border-top:1px solid var(--line);padding:12px 14px}
    .kv{column-gap:12px;row-gap:6px}
    .kv dd{font-size:14.5px;word-break:break-word}
    .badge{font-size:11px;padding:4px 9px;white-space:normal;text-align:center}
    td.emptyrow{background:var(--surface);border:1px solid var(--line);border-radius:14px}
    tr:has(.emptyrow){display:block}
    .pager{padding:6px 0;flex-wrap:wrap}
  }
  @media (max-width:360px){
    .cards{grid-template-columns:1fr}
    .kv{grid-template-columns:1fr}
    .kv dt{margin-top:4px}
  }
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="brand">
      <div class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg></div>
      <div><h1>Smart Fleet</h1><small>PROVINCE REGISTRATION</small></div>
      <span class="live" id="live" title="สถานะการเชื่อมต่อข้อมูลกลาง"><i></i><span id="liveTxt">กำลังเชื่อมต่อ</span></span>
    </div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="ค้นหาทะเบียน หรือ เลขรายการ..." aria-label="ค้นหา">
    </div>
    <button class="btn primary" id="upBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/></svg>
      <span id="upTxt">อัปโหลด Excel</span>
    </button>
    <input type="file" id="file" accept=".xlsx,.xls" hidden>
  </div>
</header>

<main>
  <section class="cards">
    <div class="card">
      <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.62l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg></div>
      <div><div class="lbl" id="jobLbl">งานวันนี้ (ไม่รวมยกเลิก)</div><div class="val mono"><span id="jobCount">0</span><small>รายการ</small></div></div>
    </div>
    <div class="card">
      <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg></div>
      <div><div class="lbl">กำไรทั้งหมด</div><div class="val mono" id="profitAll">฿0</div></div>
    </div>
    <div class="card">
      <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/></svg></div>
      <div><div class="lbl" id="monthLbl">กำไรเดือนนี้</div><div class="val mono"><span id="profitMonth">฿0</span><span class="pill" id="monthPct"></span></div></div>
    </div>
    <div class="card dark">
      <div class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
      <div><div class="lbl">อัปเดตล่าสุด</div><div class="val mono" id="updated">-</div><div class="by" id="updatedBy"></div></div>
    </div>
  </section>

  <section class="toolbar">
    <div class="seg" id="dateField">
      <button data-f="load" class="on">วันที่ขึ้น</button>
      <button data-f="deliv">วันที่ส่ง</button>
    </div>
    <div class="range">
      <span>จาก</span><input type="date" id="from" aria-label="จากวันที่">
      <span>ถึง</span><input type="date" id="to" aria-label="ถึงวันที่">
    </div>
    <div class="seg" id="quick">
      <button data-q="yesterday">เมื่อวาน</button>
      <button data-q="today" class="on">วันนี้</button>
      <button data-q="tomorrow">พรุ่งนี้</button>
      <button data-q="week">7 วัน</button>
      <button data-q="month">เดือนนี้</button>
      <button data-q="all">ทั้งหมด</button>
    </div>
    <select class="stf" id="status" aria-label="สถานะ"><option value="">ทุกสถานะ</option></select>
    <div class="count" id="count"></div>
  </section>

  <section class="tbl">
    <div class="tbl-scroll">
      <table>
        <thead><tr>
          <th>วันที่ขึ้น-ส่ง</th><th>ปลายทาง</th><th>รถขนส่ง</th><th class="r">ราคาที่จ่าย (บาท)</th><th>สถานะ</th>
        </tr></thead>
        <tbody id="rows"><tr><td colspan="5" class="emptyrow"><b>กำลังโหลดข้อมูล…</b>รายการงานจะแสดงที่นี่</td></tr></tbody>
      </table>
    </div>
    <div class="pager" id="pager"></div>
  </section>
</main>
<div class="toast" id="toast" hidden></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import * as fs from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';
const firebaseConfig = {
  apiKey: "AIzaSyA_XN-4eXdcx8kEDlZzdr65s-zqO9PxU9w",
  authDomain: "smart-fleet-2026.firebaseapp.com",
  projectId: "smart-fleet-2026",
  storageBucket: "smart-fleet-2026.firebasestorage.app",
  messagingSenderId: "1047495695768",
  appId: "1:1047495695768:web:7762187aac0faef6c1dfed"
};
const CANCEL = 'ยกเลิกงาน';
const PAGE = 25;
const TH_MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MON_FULL = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

let DATA = [], META = {}, page = 1, loaded = false;
const st = { field:'load', from:null, to:null, status:'', q:'' };

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const iso = d => d ? `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}` : '';
const fromIso = s => { if (!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const dmy = d => d ? `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}` : '-';
const baht = n => '฿' + Math.round(n).toLocaleString('en-US');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g,'')); return isNaN(n) ? 0 : n; };

let toastT;
function toast(msg, err){ const t = $('toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : ''); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, err ? 6000 : 3500); }

function toDate(v){
  if (v == null || v === '') return null;
  if (v instanceof Date) return new Date(v.getFullYear(), v.getMonth(), v.getDate());
  if (typeof v === 'number') { const d = XLSX.SSF.parse_date_code(v); return d ? new Date(d.y, d.m-1, d.d) : null; }
  const m = String(v).match(/(\d{1,4})[\/\-](\d{1,2})[\/\-](\d{1,4})/);
  if (m) { let [a,b,c] = [+m[1],+m[2],+m[3]]; if (a > 31) return new Date(a,b-1,c); if (c > 2400) c -= 543; return new Date(c,b-1,a); }
  const d = new Date(v); return isNaN(d) ? null : new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

// Columns: A load, B deliv, C no, F place, H province, I status, L price, N paid, O partner, P driver, Q plate, R phone, T vehicle
function parseWorkbook(buf){
  const wb = XLSX.read(buf, { type:'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:'' });
  return rows.slice(1).filter(r => r.some(c => c !== '')).map(r => ({
    load: toDate(r[0]), deliv: toDate(r[1]), no: String(r[2]).trim(),
    place: String(r[5]).split('\n')[0].trim(), province: String(r[7]).trim(),
    status: String(r[8]).trim(), price: num(r[11]), paid: num(r[13]),
    partner: String(r[14]).trim(), driver: String(r[15]).trim(), plate: String(r[16]).trim(),
    phone: String(r[17]).trim(), vehicle: String(r[19] || r[18]).trim(),
  }));
}

// Compact row format stored in the shared database
const encode = r => [iso(r.load), iso(r.deliv), r.no, r.place, r.province, r.status, r.price, r.paid, r.partner, r.driver, r.plate, r.phone, r.vehicle];
const decode = a => ({ load: fromIso(a[0]), deliv: fromIso(a[1]), no: a[2], place: a[3], province: a[4], status: a[5], price: a[6], paid: a[7], partner: a[8], driver: a[9], plate: a[10], phone: a[11], vehicle: a[12] });

function badgeClass(s){
  if (s.includes('ยกเลิก')) return 'b-red';
  if (s.includes('บิล') || s.includes('EMS') || s.includes('สำเร็จ')) return 'b-green';
  if (s.includes('รถออก')) return 'b-violet';
  if (s.includes('ไม่มีทะเบียน') || s.includes('งานใหม่') || s.includes('รอ')) return 'b-amber';
  if (s.includes('ทะเบียน')) return 'b-blue';
  return '';
}

function setQuick(q){
  const t = new Date(); t.setHours(0,0,0,0);
  const add = n => { const d = new Date(t); d.setDate(d.getDate()+n); return d; };
  if (q === 'today') { st.from = t; st.to = t; }
  else if (q === 'yesterday') { st.from = add(-1); st.to = add(-1); }
  else if (q === 'tomorrow') { st.from = add(1); st.to = add(1); }
  else if (q === 'week') { st.from = t; st.to = add(6); }
  else if (q === 'month') { st.from = new Date(t.getFullYear(), t.getMonth(), 1); st.to = new Date(t.getFullYear(), t.getMonth()+1, 0); }
  else { st.from = null; st.to = null; }
  $('from').value = iso(st.from); $('to').value = iso(st.to);
  document.querySelectorAll('#quick button').forEach(b => b.classList.toggle('on', b.dataset.q === q));
  page = 1; render();
}

function inRange(r){
  const d = r[st.field];
  if (st.from && (!d || d < st.from)) return false;
  if (st.to && (!d || d > st.to)) return false;
  return true;
}

function renderCards(){
  const t = new Date(); t.setHours(0,0,0,0);
  const isToday = st.from && st.to && +st.from === +t && +st.to === +t;
  const active = DATA.filter(r => r.status !== CANCEL);
  $('jobCount').textContent = active.filter(inRange).length.toLocaleString();
  $('jobLbl').textContent = (isToday ? 'งานวันนี้' : !st.from && !st.to ? 'งานทั้งหมด' : 'งานในช่วงที่เลือก') + ' (ไม่รวมยกเลิก)';

  const profit = r => r.price - r.paid;
  $('profitAll').textContent = baht(active.reduce((s,r) => s + profit(r), 0));
  const y = t.getFullYear(), m = t.getMonth(), pm = new Date(y, m-1, 1);
  const sumMonth = (yy, mm) => active.filter(r => r.load && r.load.getFullYear() === yy && r.load.getMonth() === mm).reduce((s,r) => s + profit(r), 0);
  const cur = sumMonth(y, m), prev = sumMonth(pm.getFullYear(), pm.getMonth());
  $('monthLbl').textContent = `กำไรเดือน ${TH_MON_FULL[m]} ${y + 543}`;
  $('profitMonth').textContent = baht(cur);
  const pill = $('monthPct');
  if (prev) { const p = (cur - prev) / Math.abs(prev) * 100; pill.textContent = (p >= 0 ? '+' : '') + p.toFixed(1) + '%'; pill.className = 'pill ' + (p >= 0 ? 'up' : 'down'); pill.title = 'เทียบเดือนก่อน ' + baht(prev); }
  else { pill.textContent = ''; pill.className = 'pill'; }

  const u = META.uploadedAt ? new Date(META.uploadedAt) : null;
  $('updated').innerHTML = u ? `${u.getDate()} ${TH_MON[u.getMonth()]} ${String(u.getFullYear()+543).slice(-2)}<br> ${pad(u.getHours())}:${pad(u.getMinutes())}` : '-';
  $('updated').title = META.fileName || '';
}

function render(){
  renderCards();
  const q = st.q.toLowerCase();
  const list = DATA.filter(r => inRange(r)
      && (!st.status || r.status === st.status)
      && (!q || [r.plate, r.no, r.driver, r.partner, r.place, r.province].some(v => String(v).toLowerCase().includes(q))))
    .sort((a,b) => (a[st.field]||0) - (b[st.field]||0) || String(a.no).localeCompare(String(b.no)));

  const pages = Math.max(1, Math.ceil(list.length / PAGE));
  page = Math.min(page, pages);
  const slice = list.slice((page-1)*PAGE, page*PAGE);
  $('count').textContent = `แสดง ${list.length.toLocaleString()} จาก ${DATA.length.toLocaleString()} รายการ`;

  const kv = (k, v, cls = '') => `<dt>${k}</dt><dd class="${v ? cls : 'empty'}">${v ? esc(v) : '—'}</dd>`;
  const kvTel = v => v ? `<dt>เบอร์โทรศัพท์</dt><dd><a href="tel:${esc(v.replace(/[^0-9+]/g, ''))}">${esc(v)}</a></dd>` : kv('เบอร์โทรศัพท์', v);
  const empty = !loaded ? '<b>กำลังโหลดข้อมูล…</b>รายการงานจะแสดงที่นี่'
    : !DATA.length ? '<b>ยังไม่มีข้อมูล</b>กด "อัปโหลด Excel" เพื่อเพิ่มรายการงาน แล้วทุกเครื่องจะเห็นพร้อมกัน'
    : '<b>ไม่พบรายการ</b>ลองเปลี่ยนช่วงวันที่ หรือกด "ทั้งหมด"';
  $('rows').innerHTML = slice.length ? slice.map(r => `<tr>
    <td class="dates mono"><div><span>ขึ้น :</span> ${dmy(r.load)}</div><div><span>ส่ง :</span> ${dmy(r.deliv)}</div></td>
    <td class="dest"><b>${esc(r.place)}${r.province ? ', ' + esc(r.province) : ''}</b><small class="mono">#${esc(r.no)}</small></td>
    <td class="veh"><dl class="kv">${kv('Partner', r.partner)}${kv('ทะเบียนรถ', r.plate, 'plate')}${kv('คนขับ', r.driver)}${kvTel(r.phone)}${kv('รถที่เข้ารับสินค้า', r.vehicle, 'sub')}</dl></td>
    <td class="r price mono"><span class="lbl-m">ราคาที่จ่าย</span>${r.paid ? baht(r.paid) : '—'}</td>
    <td class="stat"><span class="badge ${badgeClass(r.status)}">${esc(r.status || '-')}</span></td>
  </tr>`).join('') : `<tr><td colspan="5" class="emptyrow">${empty}</td></tr>`;

  const pg = $('pager');
  if (pages <= 1) { pg.innerHTML = ''; return; }
  const nums = [...new Set([1, page-1, page, page+1, pages])].filter(n => n >= 1 && n <= pages).sort((a,b) => a-b);
  let h = `<button ${page===1?'disabled':''} data-p="${page-1}" aria-label="หน้าก่อน">‹</button>`, last = 0;
  nums.forEach(n => { if (n - last > 1) h += '<button disabled>…</button>'; h += `<button class="${n===page?'on':''}" data-p="${n}">${n}</button>`; last = n; });
  pg.innerHTML = h + `<button ${page===pages?'disabled':''} data-p="${page+1}" aria-label="หน้าถัดไป">›</button>`;
}

function fillStatus(){
  const cur = st.status;
  const s = [...new Set(DATA.map(r => r.status).filter(Boolean))].sort();
  $('status').innerHTML = '<option value="">ทุกสถานะ</option>' + s.map(x => `<option${x===cur?' selected':''}>${esc(x)}</option>`).join('');
  if (cur && !s.includes(cur)) st.status = '';
}

function setData(rows, meta){
  DATA = rows; META = meta; loaded = true;
  fillStatus(); render();
}


// ---------- Firebase (Firestore + Auth) ----------
// fleet/meta          -> { version, chunks, rows, fileName, uploadedAt }
// chunks/<version>-<i> -> { v, i, rows: "<JSON string of encoded rows>" }
const CHUNK_CHARS = 250000;
let fb = null, curVer = null;

function setLive(state){
  $('live').classList.toggle('on', state === 'on');
  $('liveTxt').textContent = state === 'on' ? 'Live' : state === 'off' ? 'ขาดการเชื่อมต่อ' : 'กำลังเชื่อมต่อ';
}
function showUploader(){ $('updatedBy').textContent = META.uploadedBy ? 'โดย ' + META.uploadedBy : ''; }

async function loadVersion(meta, tries = 0){
  const { collection, query, where, getDocs } = fb.fs;
  const snap = await getDocs(query(collection(fb.db, 'chunks'), where('v', '==', meta.version)));
  if (meta.version !== curVer) return;
  const docs = snap.docs.map(d => d.data()).sort((a,b) => a.i - b.i);
  if (docs.length < meta.chunks && tries < 4) { setTimeout(() => loadVersion(meta, tries + 1), 1500); return; }
  const firstLoad = !loaded;
  setData(docs.flatMap(d => JSON.parse(d.rows).map(decode)), meta);
  showUploader();
  if (!firstLoad) toast('ข้อมูลอัปเดตแล้ว: ' + (meta.fileName || 'ไฟล์ใหม่'));
}

function subscribe(){
  const { doc, onSnapshot } = fb.fs;
  onSnapshot(doc(fb.db, 'fleet', 'meta'), snap => {
    setLive('on');
    if (!snap.exists()) { curVer = null; setData([], {}); return; }
    const meta = snap.data({ serverTimestamps: 'estimate' });
    if (meta.uploadedAt && meta.uploadedAt.toDate) meta.uploadedAt = meta.uploadedAt.toDate().toISOString();
    if (meta.version === curVer) { if (loaded) { META = { ...META, uploadedAt: meta.uploadedAt }; renderCards(); } return; }
    curVer = meta.version;
    loadVersion(meta).catch(() => toast('โหลดข้อมูลไม่สำเร็จ ลองรีเฟรชหน้า', true));
  }, () => { setLive('off'); toast('เชื่อมต่อฐานข้อมูลไม่ได้ ตรวจสอบอินเทอร์เน็ตแล้วรีเฟรชหน้า', true); });
}

async function publishRows(rows, fileName){
  const { doc, setDoc, deleteDoc, collection, query, where, getDocs, serverTimestamp } = fb.fs;
  const version = Date.now().toString(36);
  const enc = rows.map(encode), chunks = [];
  let cur = [], size = 0;
  for (const r of enc) {
    const s = JSON.stringify(r).length;
    if (cur.length && size + s > CHUNK_CHARS) { chunks.push(cur); cur = []; size = 0; }
    cur.push(r); size += s;
  }
  if (cur.length) chunks.push(cur);
  for (let i = 0; i < chunks.length; i++) {
    $('upTxt').textContent = `กำลังบันทึก ${i+1}/${chunks.length}`;
    await setDoc(doc(fb.db, 'chunks', `${version}-${i}`), { v: version, i, rows: JSON.stringify(chunks[i]) });
  }
  await setDoc(doc(fb.db, 'fleet', 'meta'), {
    version, chunks: chunks.length, rows: rows.length, fileName,
    uploadedAt: serverTimestamp()
  });
  try {
    const old = await getDocs(query(collection(fb.db, 'chunks'), where('v', '!=', version)));
    for (const d of old.docs) await deleteDoc(d.ref);
  } catch (_) {}
}


// ---------- Events ----------
$('upBtn').onclick = () => $('file').click();
$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  e.target.value = '';
  const rd = new FileReader();
  rd.onload = async () => {
    let rows;
    try { rows = parseWorkbook(rd.result); } catch (err) { toast('อ่านไฟล์ไม่สำเร็จ: ตรวจสอบว่าเป็นไฟล์ Excel (.xlsx) ที่ export จากระบบ', true); return; }
    if (!rows.length) { toast('ไฟล์นี้ไม่มีรายการงาน', true); return; }
    const btn = $('upBtn'); btn.disabled = true;
    try { await publishRows(rows, f.name); toast(`อัปโหลดแล้ว ${rows.length.toLocaleString()} รายการ ทุกเครื่องจะเห็นข้อมูลนี้`); }
    catch (err) {
      const c = err && err.code || '';
      toast(c.includes('permission') ? 'ฐานข้อมูลไม่อนุญาตให้บันทึก ติดต่อผู้ดูแลระบบ' : 'อัปโหลดไม่สำเร็จ ลองอีกครั้ง', true);
    }
    finally { btn.disabled = false; $('upTxt').textContent = 'อัปโหลด Excel'; }
  };
  rd.readAsArrayBuffer(f);
};

document.querySelectorAll('#quick button').forEach(b => b.onclick = () => setQuick(b.dataset.q));
document.querySelectorAll('#dateField button').forEach(b => b.onclick = () => {
  st.field = b.dataset.f;
  document.querySelectorAll('#dateField button').forEach(x => x.classList.toggle('on', x === b));
  page = 1; render();
});
const onRange = () => {
  st.from = fromIso($('from').value); st.to = fromIso($('to').value);
  document.querySelectorAll('#quick button').forEach(b => b.classList.remove('on'));
  page = 1; render();
};
$('from').onchange = onRange; $('to').onchange = onRange;
$('status').onchange = e => { st.status = e.target.value; page = 1; render(); };
$('q').oninput = e => { st.q = e.target.value.trim(); page = 1; render(); };
$('pager').onclick = e => { const p = e.target.dataset.p; if (p) { page = +p; render(); window.scrollTo({ top: $('rows').closest('section').offsetTop - 90 }); } };

// ---------- Start ----------
setQuick('today');
if (!firebaseConfig.apiKey || firebaseConfig.apiKey.startsWith('PASTE')) {
  loaded = true; render(); setLive('off'); $('liveTxt').textContent = 'ยังไม่ได้ตั้งค่า Firebase';
} else {
  const app = initializeApp(firebaseConfig);
  fb = { fs, db: fs.getFirestore(app) };
  subscribe();
  setTimeout(() => {
    if (!loaded) { setLive('off'); toast('ยังเชื่อมต่อฐานข้อมูลไม่ได้ ตรวจสอบอินเทอร์เน็ต หรือแจ้งผู้ดูแลระบบ', true); }
  }, 10000);
}
</script>
